name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync server into the App folder
        run: scripts/sync-app.sh
      - name: Build
        run: >
          docker build
          --build-arg BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:trixie
          -t local-ocr:ci local_ocr/
      - name: Smoke test
        run: tests/smoke.sh local-ocr:ci
      - name: Latency check (arm only)
        if: matrix.arch == 'aarch64'
        run: |
          docker run -d --name latency -p 127.0.0.1:8738:8738 local-ocr:ci
          up=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8738/v1/health >/dev/null 2>&1; then up=1; break; fi
            sleep 1
          done
          if [ "${up}" != 1 ]; then echo "FAIL: /v1/health never came up"; exit 1; fi
          read_once() {
            curl -fsS -o /dev/null -w '%{time_total}\n' \
              -F image=@fixtures/envelopes/env02_id.jpg -F preset=envelope \
              http://127.0.0.1:8738/v1/read
          }
          read_once >/dev/null   # warm-up: loads the model
          # 7 timed samples; the first is dropped as residual warm-up, the median of the other 6 is checked.
          for _ in $(seq 1 7); do read_once; done | tail -n +2 | sort -n > times.txt
          median_ms="$(awk '{a[NR]=$1} END {printf "%d", (a[int(NR/2)]+a[int(NR/2)+1])/2*1000}' times.txt)"
          echo "median ms: ${median_ms} (limit 1500)"
          if [ "${median_ms}" -lt 1500 ]; then echo "PASS"; else echo "FAIL: median ${median_ms} ms >= 1500 ms"; exit 1; fi
      - name: Cleanup
        if: always()
        run: docker rm -f latency >/dev/null 2>&1 || true
