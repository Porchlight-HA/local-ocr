name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install
        working-directory: server
        run: pip install -e ".[test]" ruff mypy
      - name: Ruff
        working-directory: server
        run: ruff check .
      - name: Mypy
        working-directory: server
        run: mypy local_ocr_server
      - name: Pytest (including golden accuracy tests)
        working-directory: server
        run: python -m pytest -q

  hadolint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: local_ocr/Dockerfile
