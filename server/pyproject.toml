[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ocr-server"
version = "0.1.0"
description = "Offline CPU OCR server (RapidOCR + onnxruntime)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "rapidocr==3.10.*",
    "onnxruntime==1.31.*",
    "opencv-python-headless>=4.10",
    "numpy>=2",
    "aiohttp>=3.10",
    "Pillow>=10",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-aiohttp>=1.0",
    "rapidfuzz>=3.9",
]

[tool.setuptools]
packages = ["local_ocr_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
