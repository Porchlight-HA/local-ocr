[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ocr-server"
version = "0.2.0"
description = "Offline CPU OCR server (RapidOCR + onnxruntime)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "rapidocr==3.10.*",
    "onnxruntime==1.31.*",
    "opencv-python-headless~=5.0.0.93",
    "numpy~=2.5.4",
    "aiohttp~=3.14.5",
    "Pillow~=13.0.0",
    "zeroconf~=0.151.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-aiohttp>=1.0",
    "rapidfuzz>=3.9",
]

[tool.setuptools]
packages = ["local_ocr_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E741"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["local_ocr_server"]

[[tool.mypy.overrides]]
module = ["rapidocr.*", "cv2.*", "onnxruntime.*", "zeroconf.*"]
ignore_missing_imports = true
follow_untyped_imports = true
