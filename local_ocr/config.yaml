name: Local OCR
slug: local_ocr
version: 0.3.1
description: Offline OCR for Home Assistant. Reads text from images on this device, with no cloud service.
url: https://github.com/Porchlight-HA/local-ocr
image: ghcr.io/porchlight-ha/{arch}-local-ocr
arch:
  - aarch64
  - amd64
init: false
watchdog: "http://[HOST]:[PORT:8738]/v1/health"
hassio_api: true
discovery:
  - text_reader
ports:
  8738/tcp: null
ports_description:
  8738/tcp: OCR API (only needed for access from outside Home Assistant)
options:
  idle_unload_minutes: 10
  max_side: 2000
  log_level: info
schema:
  idle_unload_minutes: int(1,1440)
  max_side: int(640,4000)
  log_level: list(debug|info|warning|error)
